name: Assemble exact private SDK asset
on:
  workflow_dispatch:
    inputs:
      recipe_asset:
        description: Immutable assembly recipe asset name in candidate3
        required: true
        type: string
      recipe_sha256:
        description: Reviewed SHA-256 of the assembly recipe
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: sdk-assembly-${{ inputs.recipe_sha256 }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RECIPE_ASSET: ${{ inputs.recipe_asset }}
      RECIPE_SHA256: ${{ inputs.recipe_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact assembly and rejection contracts
        run: /usr/bin/python3 -m unittest discover -s tools/tests -p sdk_remote_assembly_test.py
      - name: Download reviewed private recipe
        run: |
          /usr/bin/python3 -c 'import os,re; assert re.fullmatch(r"showcase-sdk-assembly-[a-z0-9-]+\.json\.gz",os.environ["RECIPE_ASSET"]); assert re.fullmatch(r"[a-f0-9]{64}",os.environ["RECIPE_SHA256"])'
          mkdir "$RUNNER_TEMP/recipe"
          gh release download showcase-v0.1.0-preview.6.0-candidate3 --repo "$GITHUB_REPOSITORY" --pattern "$RECIPE_ASSET" --dir "$RUNNER_TEMP/recipe"
      - name: Reassemble original archive bytes and publish only after verification
        run: /usr/bin/python3 tools/sdk-remote-assembly.py assemble --recipe "$RUNNER_TEMP/recipe/$RECIPE_ASSET" --recipe-sha256 "$RECIPE_SHA256" --destination "$RUNNER_TEMP/assembled" --upload
      - name: Retain exact assembly and server digest evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-assembly-${{ inputs.recipe_sha256 }}
          path: ${{ runner.temp }}/assembled/assembly-result.json
          if-no-files-found: error
