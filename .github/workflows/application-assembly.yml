name: Assemble exact private Android application
on:
  workflow_dispatch:
    inputs:
      recipe_asset:
        description: Immutable APK assembly recipe in candidate3
        required: true
        type: string
      recipe_sha256:
        description: Reviewed recipe SHA-256
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: apk-assembly-${{ inputs.recipe_sha256 }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RECIPE_ASSET: ${{ inputs.recipe_asset }}
      RECIPE_SHA256: ${{ inputs.recipe_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact APK reconstruction and rejection tests
        run: python3 -m unittest discover -s tools/tests -p application_remote_assembly_test.py
      - name: Download reviewed immutable private recipe
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"showcase-apk-assembly-[a-z0-9-]+\.json\.gz",os.environ["RECIPE_ASSET"]); assert re.fullmatch(r"[a-f0-9]{64}",os.environ["RECIPE_SHA256"])'
          mkdir "$RUNNER_TEMP/recipe"
          gh release download showcase-v0.1.0-preview.6.0-candidate3 --repo "$GITHUB_REPOSITORY" --pattern "$RECIPE_ASSET" --dir "$RUNNER_TEMP/recipe"
      - name: Reconstruct exact original APK and publish verified bytes
        run: python3 tools/application-remote-assembly.py assemble --recipe "$RUNNER_TEMP/recipe/$RECIPE_ASSET" --recipe-sha256 "$RECIPE_SHA256" --destination "$RUNNER_TEMP/assembled" --upload
      - name: Retain APK and server digest evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-assembly-${{ inputs.recipe_sha256 }}
          path: ${{ runner.temp }}/assembled/assembly-result.json
          if-no-files-found: error
