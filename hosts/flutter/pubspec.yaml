name: container_showcase
description: Private native showcase for the restricted Weapp Container runtime.
publish_to: none
version: 0.1.0-preview.6.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  path_provider: 2.1.5
  weapp_container:
    path: ../../.runtime/sdk/flutter/weapp_container
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fixture-index.json
    - assets/portable-pack/manifest.json
    - assets/portable-pack/blobs/sha256/
    - assets/fonts/NotoSansSC.ttf
    - assets/fonts/OFL.txt
